name: CGV 스파이더맨 감시

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_hot:
        description: "쿨다운 무시하고 60초 간격으로 강제 실행"
        type: boolean
        default: false

# 실행이 겹치는 것을 막지 않는다 (cron 지연 시 공백을 메운다).

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 이전 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: state
          key: cgv-state-${{ github.run_id }}
          restore-keys: cgv-state-

      # CGV는 약 8일 앞까지만 예매를 연다. 대상 날짜가 아직 그 지평 밖이면
      # 아무 일도 일어나지 않으므로 촘촘히 볼 이유가 없다.
      # 지평에 가까워지면 자동으로 60초 간격으로 전환한다.
      - name: 폴링 강도 결정
        id: mode
        env:
          FORCE_HOT: ${{ inputs.force_hot }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, datetime
          KST = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(KST).date()
          targets = ["20260809", "20260816"]

          # 2026-07-27 실측: CGV는 약 8일 앞까지 예매를 연다.
          # 즉 오픈은 '대상일 - 8일' 무렵에 일어난다. 그 구간만 60초로 조준하고,
          # 나머지 기간은 5분 간격으로 취소표만 지켜본다.
          HOT_LO, HOT_HI = 5, 12  # 지평이 흔들려도 걸리도록 앞뒤로 여유를 뒀다
          days = [
              (datetime.datetime.strptime(t, "%Y%m%d").date() - today).days
              for t in targets
          ]
          upcoming = [d for d in days if d >= 0]
          nearest = min(upcoming) if upcoming else -1

          forced = os.environ.get("FORCE_HOT", "").lower() == "true"
          hot = forced or any(HOT_LO <= d <= HOT_HI for d in upcoming)

          print(f"polls={10 if hot else 1}")
          print(f"label={'HOT(60초 간격)' if hot else 'COLD(5분 간격)'}")
          print(f"nearest={nearest}")
          PY

      - name: 감시 실행
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          POLLS: ${{ steps.mode.outputs.polls }}
        run: |
          echo "모드: ${{ steps.mode.outputs.label }} / 가장 가까운 대상까지 ${{ steps.mode.outputs.nearest }}일"
          for i in $(seq 1 "$POLLS"); do
            echo "--- 폴링 $i/$POLLS ---"
            # 일시적 오류로 남은 회차를 건너뛰지 않도록 실패를 삼킨다.
            python3 cgv_spiderman_watch.py --single --no-macos \
              --state-file state/cgv_state.json \
              --theater 0013 \
              --dates 20260809 20260816 \
              --movie 스파이더맨 \
              --halls 144 \
              --min-seats 2 || echo "이번 회차 실패, 계속 진행"
            if [ "$i" -lt "$POLLS" ]; then sleep 60; fi
          done

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: cgv-state-${{ github.run_id }}
