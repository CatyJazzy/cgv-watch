name: CGV 스파이더맨 감시

on:
  schedule:
    # cron 최소 간격은 5분이고 실제로는 지연이 잦다.
    # 그래서 각 실행이 내부에서 60초 간격으로 10분간 폴링한다.
    # 실행이 겹치면 그만큼 중복 조회가 되지만, 그게 지연/누락보다 낫다.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# 겹쳐 도는 것을 일부러 막지 않는다 (cron 지연 시 공백을 메우는 역할).

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 이전 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: state
          key: cgv-state-${{ github.run_id }}
          restore-keys: cgv-state-

      - name: 감시 (60초 간격 × 10회)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          for i in $(seq 1 10); do
            echo "--- 폴링 $i/10 ---"
            # 일시적 네트워크 오류로 남은 회차를 건너뛰지 않도록 실패를 삼킨다.
            python3 cgv_spiderman_watch.py --single --no-macos \
              --state-file state/cgv_state.json \
              --theater 0013 \
              --dates 20260809 20260816 \
              --movie 스파이더맨 \
              --min-seats 2 || echo "이번 회차 실패, 계속 진행"
            if [ "$i" -lt 10 ]; then sleep 60; fi
          done

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: cgv-state-${{ github.run_id }}
